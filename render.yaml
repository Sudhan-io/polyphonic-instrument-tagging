services:
  - type: web
    name: polyphonic-instrument-tagging
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: AUDIOTAG_ENGINE
        value: onnx
      - key: AUDIOTAG_ALLOWED_ORIGINS
        value: "*"
